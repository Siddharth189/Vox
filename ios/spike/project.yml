# XcodeGen spec. CI generates the Xcode project from this, so no .xcodeproj is
# checked in and the project can be edited from Windows.
name: VoxSpike
options:
  bundleIdPrefix: com.siddharth189
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  VoxSpike:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: VoxSpikeKeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vox Spike
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Vox Spike tests whether the microphone keeps running in the background.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siddharth189.voxspike
  VoxSpikeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Vox Spike Keyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siddharth189.voxspike.keyboard
schemes:
  VoxSpike:
    build:
      targets:
        VoxSpike: all
