[package]
name = "vox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vox"
path = "src/main.rs"

# Shared dependency versions match the Vox macOS spec.
[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
arboard = "3"
cpal = "0.15"
tao = "0.35.3"
tray-icon = "0.24.1"
global-hotkey = "0.8.0"
enigo = "0.6.1"
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net"] }
libc = "0.2"

# Exact macOS stack from the Vox spec.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }
core-graphics = "0.25.0"
core-foundation = "0.10"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

# Whisper still runs on Linux, just on CPU instead of Metal.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.14"

[dev-dependencies]
tempfile = "3"
