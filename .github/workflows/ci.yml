name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: build, test, clippy (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Ensure cmake is available
        run: command -v cmake || brew install cmake

      # fmt/clippy are informational for now (codebase hasn't been run through
      # them under a working macOS toolchain yet) - tighten to hard-fail once green.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --all-features

  linux:
    name: build, test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      # cmake/gcc for whisper-rs, alsa for cpal, libxdo for enigo,
      # gtk3/appindicator for tray-icon. kdotool/xdotool are runtime-only
      # (shelled out to for active-window detection), not build deps.
      - name: Install native dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libasound2-dev \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # Same informational-for-now stance as the macOS job.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --all-features

  windows:
    name: build, test, package (windows-latest)
    runs-on: windows-latest
    env:
      # The zip below is distributed: build for a portable AVX2 baseline, not
      # the runner's CPU (see cmake/portable-cpu.cmake).
      CMAKE_PROJECT_INCLUDE_BEFORE: ${{ github.workspace }}/cmake/portable-cpu.cmake
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      # The runner image ships MSVC, CMake, and LLVM (libclang for bindgen),
      # which is everything whisper-rs needs.
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --all-features

      - name: vox smoke test
        shell: pwsh
        run: |
          .\target\release\vox.exe --version
          .\target\release\vox.exe doctor --json
          exit 0

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\vox.exe, target\release\vox-tray.exe, scripts\install-windows.ps1, scripts\uninstall-windows.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath Vox-windows-x86_64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Vox-windows-x86_64
          path: Vox-windows-x86_64.zip
