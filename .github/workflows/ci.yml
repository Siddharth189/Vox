name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: build, test, clippy (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Ensure cmake is available
        run: command -v cmake || brew install cmake

      # fmt/clippy are informational for now (codebase hasn't been run through
      # them under a working macOS toolchain yet) - tighten to hard-fail once green.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --all-features

  linux:
    name: build, test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      # cmake/gcc for whisper-rs, alsa for cpal, libxdo for enigo,
      # gtk3/appindicator for tray-icon. kdotool/xdotool are runtime-only
      # (shelled out to for active-window detection), not build deps.
      - name: Install native dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libasound2-dev \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # Same informational-for-now stance as the macOS job.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --all-features
