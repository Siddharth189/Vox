name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: build, test, clippy (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Ensure cmake is available
        run: command -v cmake || brew install cmake

      # fmt/clippy are informational for now (codebase hasn't been run through
      # them under a working macOS toolchain yet) - tighten to hard-fail once green.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --all-features

  # Best-effort only: Vox is a macOS product (see the macos-14 job above for the
  # real correctness gate). This job exists so contributors without a Mac get
  # fast feedback on the platform-independent logic (config, prompt/dictionary
  # rules, pipeline). It's allowed to fail - tray-icon/tao/global-hotkey/enigo
  # all need Linux-specific native GUI libs (GTK, libxdo, appindicator) whose
  # exact package set isn't verified here.
  linux-logic-check:
    name: cargo check (Linux, best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test (non-macOS stubs + pure logic)
        run: cargo test
